name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}

      - run: mix local.hex --force
      - run: mix deps.get

      - name: Formato (mix format)
        run: mix format --check-formatted

      - name: Lint (Credo)
        run: mix credo --strict

      - run: mix compile --warnings-as-errors

      - name: Analisis de seguridad (Sobelow)
        run: mix sobelow --config

      - name: Regenerar openapi.yaml
        run: make openapi
      - name: Commitear openapi.yaml si cambió
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(openapi): regenerate openapi.yaml [skip ci]"
          file_pattern: openapi.yaml

      - name: Tests (unitarios + integracion contra Mongo y RabbitMQ reales; falla si la cobertura < 70%)
        env:
          MIX_ENV: test
          MONGO_URL: mongodb://localhost:27017/notifications_test
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
        run: mix coveralls

      - name: Analisis estatico (Dialyzer)
        run: mix dialyzer

  contract:
    # Valida openapi.yaml contra el servicio real con Schemathesis. Corre en paralelo a `test`,
    # con Mongo y RabbitMQ del propio runner, valores de juguete y sin secrets.*.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017/notifications_contract
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      APP_PORT: "18087"
      CONTRACT_MAX_EXAMPLES: "25"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-contract-${{ hashFiles('**/mix.lock') }}

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get

      - name: Instalar Schemathesis
        run: |
          python -m venv .contract-venv
          .contract-venv/bin/pip install schemathesis==4.33.4

      - name: Contrato (Schemathesis contra el servicio)
        run: ./scripts/contract-test.sh

      - name: Reporte de contrato
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-report
          path: contract-report/
          if-no-files-found: ignore
