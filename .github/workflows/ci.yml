name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}

      - run: mix local.hex --force
      - run: mix deps.get

      - name: Formato (mix format)
        run: mix format --check-formatted

      - name: Lint (Credo)
        run: mix credo --strict

      - run: mix compile --warnings-as-errors
      - run: mix test --cover

      - name: Analisis estatico (Dialyzer)
        run: mix dialyzer
