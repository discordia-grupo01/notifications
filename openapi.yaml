---
components:
  responses: {}
  schemas:
    ChannelSetting:
      properties:
        channel_id:
          type: string
          x-struct:
          x-validate:
        level:
          description: Preferencia guardada, o `null` si hereda la del servidor.
          enum:
            - all
            - mentions
            - none
            -
          nullable: true
          type: string
          x-struct:
          x-validate:
        muted:
          type: boolean
          x-struct:
          x-validate:
      required:
        - channel_id
        - muted
        - level
      title: ChannelSetting
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.ChannelSetting
      x-validate:
    ErrorResponse:
      properties:
        error:
          properties:
            code:
              type: string
              x-struct:
              x-validate:
            details:
              type: object
              x-struct:
              x-validate:
            message:
              type: string
              x-struct:
              x-validate:
          required:
            - code
            - message
            - details
          type: object
          x-struct:
          x-validate:
      required:
        - error
      title: ErrorResponse
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.ErrorResponse
      x-validate:
    HistoryItem:
      description: 'Una notificación del historial. Lleva solo ids (nunca el texto del mensaje): el cliente resuelve nombres y contenido con los datos que ya tiene o con messaging.'
      properties:
        author_id:
          type: string
          x-struct:
          x-validate:
        channel_id:
          description: Canal de la mención. Solo en `mention`.
          nullable: true
          type: string
          x-struct:
          x-validate:
        conversation_id:
          description: Conversación del mensaje directo. Solo en `direct_message`.
          nullable: true
          type: string
          x-struct:
          x-validate:
        kind:
          description: '`mention`: te mencionaron en un canal. `direct_message`: te escribieron.'
          enum:
            - mention
            - direct_message
          type: string
          x-struct:
          x-validate:
        message_id:
          description: Id (UUIDv7) del mensaje.
          type: string
          x-struct:
          x-validate:
        occurred_at:
          format: date-time
          type: string
          x-struct:
          x-validate:
        server_id:
          description: Solo en `mention`.
          nullable: true
          type: string
          x-struct:
          x-validate:
      required:
        - kind
        - message_id
        - author_id
        - occurred_at
      title: HistoryItem
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.HistoryItem
      x-validate:
    HistoryPage:
      properties:
        items:
          description: Más nuevas primero. Una lista vacía significa que no hay notificaciones para mostrar.
          items:
            $ref: '#/components/schemas/HistoryItem'
          type: array
          x-struct:
          x-validate:
        next_cursor:
          description: Pasarlo como `before` para pedir la página siguiente (más viejas). `null` cuando no hay más.
          nullable: true
          type: string
          x-struct:
          x-validate:
      required:
        - items
        - next_cursor
      title: HistoryPage
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.HistoryPage
      x-validate:
    PushDevice:
      properties:
        id:
          description: Id opaco del dispositivo. Se usa para borrarlo; no contiene el token.
          type: string
          x-struct:
          x-validate:
      required:
        - id
      title: PushDevice
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.PushDevice
      x-validate:
    PushDeviceRequest:
      description: 'Datos del dispositivo a registrar. Con `provider: expo` (app) va `token`; con `provider: webpush` (navegador) va la suscripción: `endpoint`, `p256dh` y `auth`. El token nunca viaja en la URL.'
      properties:
        auth:
          description: 'Solo `webpush`: secreto de autenticación, base64url (16 bytes).'
          type: string
          x-struct:
          x-validate:
        endpoint:
          description: 'Solo `webpush`: URL https del servicio de push del navegador (`PushSubscription.endpoint`).'
          type: string
          x-struct:
          x-validate:
        p256dh:
          description: 'Solo `webpush`: clave pública del navegador, base64url (65 bytes).'
          type: string
          x-struct:
          x-validate:
        platform:
          enum:
            - web
            - android
            - ios
          type: string
          x-struct:
          x-validate:
        provider:
          enum:
            - webpush
            - expo
          type: string
          x-struct:
          x-validate:
        token:
          description: 'Solo `expo`: `ExponentPushToken[...]` que entrega `expo-notifications`.'
          type: string
          x-struct:
          x-validate:
      required:
        - provider
        - platform
      title: PushDeviceRequest
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.PushDeviceRequest
      x-validate:
    PushSettings:
      properties:
        enabled:
          description: '`true` por defecto. No afecta los indicadores dentro de la app.'
          type: boolean
          x-struct:
          x-validate:
      required:
        - enabled
      title: PushSettings
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.PushSettings
      x-validate:
    PushSettingsRequest:
      properties:
        enabled:
          description: '`false` apaga el push en todos los dispositivos.'
          type: boolean
          x-struct:
          x-validate:
      required:
        - enabled
      title: PushSettingsRequest
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.PushSettingsRequest
      x-validate:
    ServerSetting:
      properties:
        level:
          description: Preferencia guardada, o `null` si no hay (se usa el valor por defecto).
          enum:
            - all
            - mentions
            - none
            -
          nullable: true
          type: string
          x-struct:
          x-validate:
        muted:
          type: boolean
          x-struct:
          x-validate:
        server_id:
          type: string
          x-struct:
          x-validate:
      required:
        - server_id
        - muted
        - level
      title: ServerSetting
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.ServerSetting
      x-validate:
    SettingsListing:
      properties:
        channels:
          description: Canales que el usuario silenció, con el servidor al que pertenecen.
          items:
            properties:
              channel_id:
                type: string
                x-struct:
                x-validate:
              server_id:
                type: string
                x-struct:
                x-validate:
            required:
              - channel_id
              - server_id
            type: object
            x-struct:
            x-validate:
          type: array
          x-struct:
          x-validate:
        preferences:
          description: Preferencias de nivel que el usuario fijó.
          properties:
            channels:
              items:
                properties:
                  channel_id:
                    type: string
                    x-struct:
                    x-validate:
                  level:
                    enum:
                      - all
                      - mentions
                      - none
                    type: string
                    x-struct:
                    x-validate:
                  server_id:
                    type: string
                    x-struct:
                    x-validate:
                required:
                  - channel_id
                  - server_id
                  - level
                type: object
                x-struct:
                x-validate:
              type: array
              x-struct:
              x-validate:
            servers:
              items:
                properties:
                  level:
                    enum:
                      - all
                      - mentions
                      - none
                    type: string
                    x-struct:
                    x-validate:
                  server_id:
                    type: string
                    x-struct:
                    x-validate:
                required:
                  - server_id
                  - level
                type: object
                x-struct:
                x-validate:
              type: array
              x-struct:
              x-validate:
          required:
            - servers
            - channels
          type: object
          x-struct:
          x-validate:
        servers:
          description: Ids de los servidores que el usuario silenció.
          items:
            type: string
            x-struct:
            x-validate:
          type: array
          x-struct:
          x-validate:
      required:
        - servers
        - channels
        - preferences
      title: SettingsListing
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.SettingsListing
      x-validate:
    SettingsRequest:
      description: Al menos uno de `muted` o `level`. Solo cambia lo que se manda.
      properties:
        level:
          description: 'Qué avisa: `all` (todos los mensajes), `mentions` (solo menciones; es el valor por defecto) o `none`. `null` borra la preferencia y vuelve a heredar.'
          enum:
            - all
            - mentions
            - none
            -
          nullable: true
          type: string
          x-struct:
          x-validate:
        muted:
          description: '`true` silencia; `false` reactiva las notificaciones destacadas.'
          type: boolean
          x-struct:
          x-validate:
      title: SettingsRequest
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.SettingsRequest
      x-validate:
    SocketTicket:
      properties:
        expires_in:
          description: Segundos que el ticket es válido desde que se emite.
          type: integer
          x-struct:
          x-validate:
        ticket:
          description: Ticket de un solo uso. Se manda como `?ticket=<ticket>` al conectar el WebSocket.
          type: string
          x-struct:
          x-validate:
      required:
        - ticket
        - expires_in
      title: SocketTicket
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.SocketTicket
      x-validate:
    VapidPublicKey:
      properties:
        public_key:
          description: Clave pública VAPID en base64url. Es el `applicationServerKey` de `pushManager.subscribe`.
          type: string
          x-struct:
          x-validate:
      required:
        - public_key
      title: VapidPublicKey
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.VapidPublicKey
      x-validate:
info:
  description: 'Indicadores de no leído por canal y por servidor. Todo el estado viaja por WebSocket (canal `notifications:<user_id>` en `/notifications/socket`): al unirse se recibe el estado completo y después los cambios en vivo. Por REST se pide el ticket para abrir ese socket y se administran los silenciados de canales y servidores.'
  title: Discordia — Notifications
  version: 0.1.0
openapi: 3.0.0
paths:
  /health:
    get:
      callbacks: {}
      operationId: NotificationsWeb.HealthController.health
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  status:
                    example: ok
                    type: string
                    x-struct:
                    x-validate:
                type: object
                x-struct:
                x-validate:
          description: ok
      summary: Ping -- responde 200 sin tocar Mongo ni el broker; sirve para mantener despierto el servicio y para monitores externos
      tags:
        - ops
  /livez:
    get:
      callbacks: {}
      operationId: NotificationsWeb.HealthController.livez
      parameters: []
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
                x-struct:
                x-validate:
          description: ok
      summary: Liveness -- confirma que el proceso responde, sin tocar Mongo ni el broker
      tags:
        - ops
  /readyz:
    get:
      callbacks: {}
      operationId: NotificationsWeb.HealthController.readyz
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                x-struct:
                x-validate:
          description: ready
        '503':
          content:
            application/json:
              schema:
                type: object
                x-struct:
                x-validate:
          description: Mongo no responde
      summary: Readiness -- confirma que el servicio puede operar (pinguea Mongo)
      tags:
        - ops
  /v1/notifications/history:
    get:
      callbacks: {}
      description: Menciones y mensajes directos recientes, ordenados por fecha, del más nuevo al más viejo, con los ids para ir directo a cada conversación. Solo incluye lo que avisó según las preferencias del momento (un canal silenciado o en `none` no deja entradas) y se conserva para siempre, salvo que `HISTORY_RETENTION_DAYS` fije un plazo en días. Las menciones de canales que el usuario ya no puede ver no se listan. Si no hay nada, `items` viene vacío.
      operationId: NotificationsWeb.HistoryController.index
      parameters:
        - description: Cantidad de entradas, de 1 a 100. Por defecto 50.
          in: query
          name: limit
          required: false
          schema:
            type: integer
            x-struct:
            x-validate:
        - description: '`next_cursor` de la página anterior (texto opaco, se reenvía tal cual): trae las entradas más viejas.'
          in: query
          name: before
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
          description: Página del historial
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: '`limit` o `before` inválido'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo leer el historial
      summary: Historial de notificaciones del usuario
      tags:
        - history
  /v1/notifications/push/devices:
    post:
      callbacks: {}
      description: 'Se llama después de que el usuario da el permiso de notificaciones. El token o la suscripción viajan solo en el cuerpo. Es idempotente: registrar de nuevo el mismo dispositivo devuelve el mismo `id` (200) y, si estaba asociado a otro usuario, pasa a este. El máximo es de 10 dispositivos por usuario.'
      operationId: NotificationsWeb.PushController.register_device
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushDeviceRequest'
        description: Dispositivo
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDevice'
          description: El dispositivo ya estaba registrado
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDevice'
          description: Dispositivo registrado
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Proveedor, plataforma o credenciales inválidos
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Se alcanzó el máximo de dispositivos
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo guardar el dispositivo
      summary: Registra un dispositivo para recibir notificaciones push
      tags:
        - push
  /v1/notifications/push/devices/{id}:
    delete:
      callbacks: {}
      description: 'Se llama al cerrar sesión o al desactivar el permiso. Es idempotente: si el `id` no existe o es de otro usuario responde igual.'
      operationId: NotificationsWeb.PushController.delete_device
      parameters:
        - description: Id devuelto al registrar el dispositivo
          in: path
          name: id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      responses:
        '204':
          description: Dispositivo quitado
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo quitar el dispositivo
      summary: Quita un dispositivo de las notificaciones push
      tags:
        - push
  /v1/notifications/push/settings:
    get:
      callbacks: {}
      description: Es un interruptor único por usuario, válido para todos sus dispositivos. Por defecto está activado.
      operationId: NotificationsWeb.PushController.show_settings
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSettings'
          description: Estado del interruptor
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo leer la configuración
      summary: Dice si el usuario recibe notificaciones push
      tags:
        - push
    put:
      callbacks: {}
      description: 'Con `enabled: false` no se manda ningún push a ningún dispositivo del usuario. No cambia los indicadores ni el historial dentro de la app. Es idempotente.'
      operationId: NotificationsWeb.PushController.update_settings
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSettingsRequest'
        description: Estado deseado
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSettings'
          description: Estado resultante
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: '`enabled` falta o no es booleano'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo guardar la configuración
      summary: Activa o desactiva las notificaciones push del usuario
      tags:
        - push
  /v1/notifications/push/vapid-public-key:
    get:
      callbacks: {}
      operationId: NotificationsWeb.PushController.vapid_public_key
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VapidPublicKey'
          description: Clave pública
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El push web no está configurado
      summary: Clave pública VAPID para suscribir un navegador
      tags:
        - push
  /v1/notifications/settings:
    get:
      callbacks: {}
      description: '`servers` y `channels` son los silenciados. `preferences` lista las preferencias de nivel (`all`, `mentions`, `none`) que el usuario fijó; lo que no aparece usa el valor heredado o el por defecto (`mentions`).'
      operationId: NotificationsWeb.SettingsController.index
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsListing'
          description: Configuración del usuario
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo leer la configuración
      summary: Lista los servidores y canales que el usuario silenció o configuró
      tags:
        - settings
  /v1/notifications/settings/channels/{channel_id}:
    put:
      callbacks: {}
      description: 'Acepta `muted`, `level` o ambos; solo cambia lo que se manda. `level` elige qué avisa el canal: `all`, `mentions` o `none`, y reemplaza al nivel del servidor. `level: null` borra la preferencia y el canal vuelve a heredar. Para fijar algo hay que poder ver el canal; borrar o reactivar no tiene esa condición. Es idempotente y las otras sesiones del usuario se enteran por `snapshot`.'
      operationId: NotificationsWeb.SettingsController.update_channel
      parameters:
        - description: Id del canal
          in: path
          name: channel_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsRequest'
        description: Estado deseado
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSetting'
          description: Estado resultante
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Falta `muted`/`level` o alguno es inválido
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El usuario no puede ver el canal
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El canal no existe
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo guardar la configuración
      summary: Silencia, reactiva o configura el nivel de notificación de un canal
      tags:
        - settings
  /v1/notifications/settings/servers/{server_id}:
    put:
      callbacks: {}
      description: 'Acepta `muted`, `level` o ambos; solo cambia lo que se manda. Silenciar apaga todos los avisos destacados de sus canales (la actividad sigue contando como no leída). `level` elige qué avisa: `all` (todos los mensajes), `mentions` (solo menciones, el valor por defecto) o `none`. `level: null` borra la preferencia. Un canal con su propia preferencia gana sobre la del servidor; silenciar siempre gana. Es idempotente y las otras sesiones del usuario se enteran por `snapshot`.'
      operationId: NotificationsWeb.SettingsController.update_server
      parameters:
        - description: Id del servidor
          in: path
          name: server_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsRequest'
        description: Estado deseado
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSetting'
          description: Estado resultante
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Falta `muted`/`level` o alguno es inválido
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El usuario no es miembro del servidor
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo guardar la configuración
      summary: Silencia, reactiva o configura el nivel de notificación de un servidor
      tags:
        - settings
  /v1/notifications/socket-tickets:
    post:
      callbacks: {}
      description: El navegador no puede mandar el header Authorization al abrir un WebSocket, y poner el JWT en la URL lo deja en logs. En su lugar, el cliente pide acá un ticket (autenticado con el Bearer normal) y conecta con `?ticket=<ticket>`.
      operationId: NotificationsWeb.SocketTicketController.create
      parameters: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocketTicket'
          description: Ticket emitido
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
