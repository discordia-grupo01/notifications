---
components:
  responses: {}
  schemas:
    ChannelMute:
      properties:
        channel_id:
          type: string
          x-struct:
          x-validate:
        muted:
          type: boolean
          x-struct:
          x-validate:
      required:
        - channel_id
        - muted
      title: ChannelMute
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.ChannelMute
      x-validate:
    ErrorResponse:
      properties:
        error:
          properties:
            code:
              type: string
              x-struct:
              x-validate:
            details:
              type: object
              x-struct:
              x-validate:
            message:
              type: string
              x-struct:
              x-validate:
          required:
            - code
            - message
            - details
          type: object
          x-struct:
          x-validate:
      required:
        - error
      title: ErrorResponse
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.ErrorResponse
      x-validate:
    MuteRequest:
      properties:
        muted:
          description: '`true` silencia; `false` reactiva las notificaciones destacadas.'
          type: boolean
          x-struct:
          x-validate:
      required:
        - muted
      title: MuteRequest
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.MuteRequest
      x-validate:
    MutedScopes:
      properties:
        channels:
          description: Canales que el usuario silenció, con el servidor al que pertenecen.
          items:
            properties:
              channel_id:
                type: string
                x-struct:
                x-validate:
              server_id:
                type: string
                x-struct:
                x-validate:
            required:
              - channel_id
              - server_id
            type: object
            x-struct:
            x-validate:
          type: array
          x-struct:
          x-validate:
        servers:
          description: Ids de los servidores que el usuario silenció.
          items:
            type: string
            x-struct:
            x-validate:
          type: array
          x-struct:
          x-validate:
      required:
        - servers
        - channels
      title: MutedScopes
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.MutedScopes
      x-validate:
    ServerMute:
      properties:
        muted:
          type: boolean
          x-struct:
          x-validate:
        server_id:
          type: string
          x-struct:
          x-validate:
      required:
        - server_id
        - muted
      title: ServerMute
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.ServerMute
      x-validate:
    SocketTicket:
      properties:
        expires_in:
          description: Segundos que el ticket es válido desde que se emite.
          type: integer
          x-struct:
          x-validate:
        ticket:
          description: Ticket de un solo uso. Se manda como `?ticket=<ticket>` al conectar el WebSocket.
          type: string
          x-struct:
          x-validate:
      required:
        - ticket
        - expires_in
      title: SocketTicket
      type: object
      x-struct: Elixir.NotificationsWeb.Schemas.SocketTicket
      x-validate:
info:
  description: 'Indicadores de no leído por canal y por servidor. Todo el estado viaja por WebSocket (canal `notifications:<user_id>` en `/notifications/socket`): al unirse se recibe el estado completo y después los cambios en vivo. Por REST se pide el ticket para abrir ese socket y se administran los silenciados de canales y servidores.'
  title: Discordia — Notifications
  version: 0.1.0
openapi: 3.0.0
paths:
  /health:
    get:
      callbacks: {}
      operationId: NotificationsWeb.HealthController.health
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  status:
                    example: ok
                    type: string
                    x-struct:
                    x-validate:
                type: object
                x-struct:
                x-validate:
          description: ok
      summary: Ping -- responde 200 sin tocar Mongo ni el broker; sirve para mantener despierto el servicio y para monitores externos
      tags:
        - ops
  /livez:
    get:
      callbacks: {}
      operationId: NotificationsWeb.HealthController.livez
      parameters: []
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
                x-struct:
                x-validate:
          description: ok
      summary: Liveness -- confirma que el proceso responde, sin tocar Mongo ni el broker
      tags:
        - ops
  /readyz:
    get:
      callbacks: {}
      operationId: NotificationsWeb.HealthController.readyz
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                x-struct:
                x-validate:
          description: ready
        '503':
          content:
            application/json:
              schema:
                type: object
                x-struct:
                x-validate:
          description: Mongo no responde
      summary: Readiness -- confirma que el servicio puede operar (pinguea Mongo)
      tags:
        - ops
  /v1/notifications/settings:
    get:
      callbacks: {}
      operationId: NotificationsWeb.SettingsController.index
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutedScopes'
          description: Silenciados del usuario
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo leer la configuración
      summary: Lista los servidores y canales que el usuario silenció
      tags:
        - settings
  /v1/notifications/settings/channels/{channel_id}:
    put:
      callbacks: {}
      description: Silenciar un canal apaga sus notificaciones destacadas (menciones). La actividad sigue contando como no leída. Para silenciarlo hay que poder ver el canal; reactivarlo no tiene esa condición. Es idempotente y las otras sesiones del usuario se enteran por `snapshot`.
      operationId: NotificationsWeb.SettingsController.update_channel
      parameters:
        - description: Id del canal
          in: path
          name: channel_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuteRequest'
        description: Estado deseado
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelMute'
          description: Estado resultante
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: '`muted` falta o no es booleano'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El usuario no puede ver el canal
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El canal no existe
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo guardar la configuración
      summary: Silencia o reactiva un canal
      tags:
        - settings
  /v1/notifications/settings/servers/{server_id}:
    put:
      callbacks: {}
      description: Silenciar un servidor apaga las notificaciones destacadas (menciones) de todos sus canales. La actividad sigue contando como no leída. Es idempotente y las otras sesiones del usuario se enteran por `snapshot`.
      operationId: NotificationsWeb.SettingsController.update_server
      parameters:
        - description: Id del servidor
          in: path
          name: server_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuteRequest'
        description: Estado deseado
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMute'
          description: Estado resultante
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: '`muted` falta o no es booleano'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El usuario no es miembro del servidor
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo guardar la configuración
      summary: Silencia o reactiva un servidor completo
      tags:
        - settings
  /v1/notifications/socket-tickets:
    post:
      callbacks: {}
      description: El navegador no puede mandar el header Authorization al abrir un WebSocket, y poner el JWT en la URL lo deja en logs. En su lugar, el cliente pide acá un ticket (autenticado con el Bearer normal) y conecta con `?ticket=<ticket>`.
      operationId: NotificationsWeb.SocketTicketController.create
      parameters: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocketTicket'
          description: Ticket emitido
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo guardar el ticket
      summary: Emite un ticket de un solo uso para conectar el WebSocket
      tags:
        - auth
security: []
servers:
  - url: http://localhost:4000
    variables: {}
tags: []
