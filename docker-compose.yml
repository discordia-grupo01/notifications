services:
  api:
    build: .
    ports:
      - "${API_PORT:-4000}:4000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-secreto-solo-local-que-no-sirve-para-produccion-0123456789-abcdefghijklmnop}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CHECK_ORIGIN: "false"
      MONGO_URL: mongodb://mongo:27017/notifications_dev
      RABBITMQ_URL: ${RABBITMQ_URL_DOCKER:-amqp://guest:guest@host.docker.internal:5672}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
